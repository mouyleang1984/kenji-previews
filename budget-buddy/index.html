<!DOCTYPE html>
<html>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Budget Buddy</title>
<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'></script>
<style>
body{margin:0;padding:16px;max-width:480px;margin-left:auto;margin-right:auto;background:#f6f7f9;color:#1a1a1a;font-family:Arial,Helvetica,sans-serif}
h1{font-size:1.4em;text-align:center;margin-bottom:4px}
h3{margin-top:4px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.15);margin-bottom:12px}
input,select,button{display:block;width:100%;box-sizing:border-box;padding:12px;margin-bottom:10px;font-size:1em;border-radius:8px;border:1px solid #ccc}
button{background:#2563eb;color:#fff;border:none;font-weight:600;cursor:pointer}
button#logout{background:#6b7280}
.hidden{display:none !important}
.error{background:#fee2e2;color:#991b1b;padding:10px;border-radius:8px;margin-bottom:10px;font-size:.9em}
.info{background:#dbeafe;color:#1e3a8a;padding:10px;border-radius:8px;margin-bottom:10px;font-size:.9em}
#total{font-weight:bold;font-size:1.6em;color:#2563eb}
#list{list-style:none;padding:0;margin:0}
#list li{padding:8px 0;border-bottom:1px solid #eee;font-size:.95em}
#loading{text-align:center;color:#555;margin-bottom:10px}
</style>
</head>
<body>
<h1>Budget Buddy</h1>
<div id='auth' class='card'>
<div id='auth-error' class='error hidden'></div>
<div id='auth-status' class='info hidden'></div>
<input id='email' type='email' placeholder='Email' autocomplete='username'>
<input id='pass' type='password' placeholder='Password' autocomplete='current-password'>
<button id='login' type='button'>Login</button>
<button id='signup' type='button'>Sign Up</button>
</div>
<div id='app' class='card hidden'>
<div id='app-error' class='error hidden'></div>
<div id='loading' class='hidden'>Loading&hellip;</div>
<p>Signed in as <strong id='user-email'></strong></p>
<button id='logout' type='button'>Logout</button>
<h3>Add Expense</h3>
<input id='desc' placeholder='Description'>
<input id='amt' type='number' step='0.01' min='0.01' placeholder='Amount'>
<select id='category'>
<option value='Food'>Food</option>
<option value='Transport'>Transport</option>
<option value='Utilities'>Utilities</option>
<option value='Entertainment'>Entertainment</option>
<option value='Other'>Other</option>
</select>
<button id='add' type='button'>Add Expense</button>
<h3>This Month&#39;s Total</h3>
<div id='total'>0.00</div>
<ul id='list'></ul>
</div>
<script>
(function(){
  var SUPABASE_URL = 'https://ohcyjurhonzdvkqoellw.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_YnS7FFbHc0at9QZ2jW5JpQ_T_JwkVUi';
  var SUPA = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  var TABLE = 'budget_buddy_expenses';

  var authDiv = document.getElementById('auth');
  var appDiv = document.getElementById('app');
  var authError = document.getElementById('auth-error');
  var authStatus = document.getElementById('auth-status');
  var appError = document.getElementById('app-error');
  var loadingEl = document.getElementById('loading');

  function showMsg(el, msg){ el.textContent = msg; el.classList.remove('hidden'); }
  function clearMsg(el){ el.textContent = ''; el.classList.add('hidden'); }

  function escapeHtml(s){
    return String(s).replace(/[&<>']/g, function(c){
      if (c === '&') return '&amp;';
      if (c === '<') return '&lt;';
      if (c === '>') return '&gt;';
      return '&#39;';
    });
  }

  function isMissingTable(err){
    if (!err) return false;
    return err.code === '42P01' || /does not exist/i.test(err.message || '') || /schema cache/i.test(err.message || '');
  }

  async function refreshExpenses(){
    clearMsg(appError);
    loadingEl.classList.remove('hidden');
    try{
      var res = await SUPA.from(TABLE).select('*').order('expense_date', { ascending: false });
      loadingEl.classList.add('hidden');
      if (res.error){
        if (isMissingTable(res.error)){
          showMsg(appError, 'Setup required: table ' + TABLE + ' was not found in Supabase (HTTP ' + res.status + ': ' + res.error.message + '). Run migrations/001-app.sql against your Supabase project.');
        } else {
          showMsg(appError, 'Error loading expenses (HTTP ' + res.status + '): ' + res.error.message);
        }
        document.getElementById('total').textContent = '0.00';
        document.getElementById('list').innerHTML = '';
        return;
      }
      var rows = res.data || [];
      var now = new Date();
      var monthRows = rows.filter(function(r){
        var d = new Date(r.expense_date);
        return d.getUTCFullYear() === now.getFullYear() && d.getUTCMonth() === now.getMonth();
      });
      var sum = monthRows.reduce(function(a,b){ return a + Number(b.amount); }, 0);
      document.getElementById('total').textContent = sum.toFixed(2);
      document.getElementById('list').innerHTML = monthRows.map(function(r){
        return `<li data-amount='${Number(r.amount)}' data-desc='${escapeHtml(r.description)}'>${escapeHtml(r.description)} - ${escapeHtml(r.category)}: $${Number(r.amount).toFixed(2)}</li>`;
      }).join('');
    }catch(e){
      loadingEl.classList.add('hidden');
      showMsg(appError, 'Unexpected error: ' + e.message);
    }
  }

  document.getElementById('signup').onclick = async function(){
    clearMsg(authError); clearMsg(authStatus);
    var email = document.getElementById('email').value.trim();
    var pass = document.getElementById('pass').value;
    if (!email || !pass){ showMsg(authError, 'Email and password are required.'); return; }
    var res = await SUPA.auth.signUp({ email: email, password: pass });
    if (res.error){ showMsg(authError, res.error.message); return; }
    if (res.data && res.data.session){
    } else {
      showMsg(authStatus, 'Account created. Check your email to confirm your address, then log in.');
    }
  };

  document.getElementById('login').onclick = async function(){
    clearMsg(authError); clearMsg(authStatus);
    var email = document.getElementById('email').value.trim();
    var pass = document.getElementById('pass').value;
    if (!email || !pass){ showMsg(authError, 'Email and password are required.'); return; }
    var res = await SUPA.auth.signInWithPassword({ email: email, password: pass });
    if (res.error){ showMsg(authError, res.error.message); return; }
  };

  document.getElementById('logout').onclick = async function(){
    await SUPA.auth.signOut();
  };

  document.getElementById('add').onclick = async function(){
    clearMsg(appError);
    var desc = document.getElementById('desc').value.trim();
    var amtVal = document.getElementById('amt').value;
    var amt = parseFloat(amtVal);
    var category = document.getElementById('category').value;
    if (!desc || isNaN(amt) || amt <= 0){ showMsg(appError, 'Enter a valid description and a positive amount.'); return; }
    var userRes = await SUPA.auth.getUser();
    if (userRes.error || !userRes.data || !userRes.data.user){ showMsg(appError, 'Not signed in.'); return; }
    var today = new Date();
    var isoDate = today.getFullYear() + '-' + String(today.getMonth()+1).padStart(2,'0') + '-' + String(today.getDate()).padStart(2,'0');
    var res = await SUPA.from(TABLE).insert({
      description: desc,
      amount: amt,
      category: category,
      expense_date: isoDate,
      owner_id: userRes.data.user.id
    });
    if (res.error){
      if (isMissingTable(res.error)){
        showMsg(appError, 'Setup required: table ' + TABLE + ' was not found in Supabase (HTTP ' + res.status + ': ' + res.error.message + '). Run migrations/001-app.sql against your Supabase project.');
      } else {
        showMsg(appError, 'Error adding expense (HTTP ' + res.status + '): ' + res.error.message);
      }
      return;
    }
    document.getElementById('desc').value = '';
    document.getElementById('amt').value = '';
    await refreshExpenses();
  };

  SUPA.auth.onAuthStateChange(function(event, session){
    if (session){
      authDiv.classList.add('hidden');
      appDiv.classList.remove('hidden');
      document.getElementById('user-email').textContent = session.user.email;
      refreshExpenses();
    } else {
      appDiv.classList.add('hidden');
      authDiv.classList.remove('hidden');
      document.getElementById('user-email').textContent = '';
    }
  });
})();
</script>
</body>
</html>
