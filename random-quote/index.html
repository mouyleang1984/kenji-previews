<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Random Quote</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden;margin:0;padding:0}img{max-width:100%;height:auto}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1c1917;color:#fafaf9;font-family:system-ui;padding:20px}
#quote{font-size:22px;font-style:italic;max-width:380px;text-align:center;margin:16px;min-height:80px;line-height:1.5}
#author{font-size:16px;font-weight:600;color:#f59e0b;margin:8px}
button{font-size:18px;height:48px;padding:0 28px;border:none;border-radius:8px;background:#f59e0b;color:#1c1917;cursor:pointer;font-weight:700}
#count{font-size:14px;color:#a8a29e;margin:12px}
</style>
</head><body>
<h1 data-testid="title">Random Quote</h1>
<div id="quote" data-testid="quote-display">Tap next for inspiration</div>
<div id="author" data-testid="author-display"></div>
<button id="next-btn" data-testid="next-btn">Next Quote</button>
<div id="count" data-testid="count-display" data-record-id="">Quotes seen: 0</div>
<script>
var QUOTES=[{q:'The best way to predict the future is to invent it.',a:'Alan Kay'},{q:'Simplicity is the soul of efficiency.',a:'Austin Freeman'},{q:'Make it work, make it right, make it fast.',a:'Kent Beck'},{q:'The only way to go fast is to go well.',a:'Uncle Bob'},{q:'Talk is cheap. Show me the code.',a:'Linus Torvalds'}];
var seen=parseInt(localStorage.getItem('quote-seen')||'0',10);
var quoteEl=document.getElementById('quote'),authorEl=document.getElementById('author'),countEl=document.getElementById('count');
window.appState={current:null,index:-1,seen:seen};
window.nextQuote=function(){var i;do{i=Math.floor(Math.random()*QUOTES.length);}while(QUOTES.length>1&&i===window.appState.index);quoteEl.textContent='"'+QUOTES[i].q+'"';authorEl.textContent='-'+QUOTES[i].a;seen++;localStorage.setItem('quote-seen',String(seen));countEl.textContent='Quotes seen: '+seen;countEl.dataset.recordId='seen-'+seen;window.appState={current:QUOTES[i].q,index:i,seen:seen};};
document.getElementById('next-btn').addEventListener('click',window.nextQuote);
countEl.textContent='Quotes seen: '+seen;countEl.dataset.recordId='seen-'+seen;
</script>
</body></html>
