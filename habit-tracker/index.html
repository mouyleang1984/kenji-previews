<!doctype html>
<html lang='en'>
<head>
<meta charset='utf-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<title>Habit Tracker</title>
<style>
  :root{font-family:system-ui,Arial,sans-serif;}
  body{margin:0;background:#0f172a;color:#e2e8f0;min-height:100vh;}
  .wrap{max-width:560px;margin:0 auto;padding:2rem 1rem;}
  h1{font-size:1.75rem;margin-bottom:0.25rem;}
  .sub{color:#94a3b8;margin-top:0;margin-bottom:1.5rem;}
  .card{background:#1e293b;border-radius:12px;padding:1.5rem;margin-bottom:1rem;box-shadow:0 4px 14px rgba(0,0,0,0.3);}
  .forms{display:flex;flex-direction:column;gap:1.5rem;}
  label{display:block;font-size:0.85rem;margin-bottom:0.25rem;color:#cbd5e1;}
  input[type=email],input[type=password],input[type=text]{width:100%;padding:0.6rem;border-radius:8px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;margin-bottom:0.75rem;box-sizing:border-box;}
  button{cursor:pointer;border:none;border-radius:8px;padding:0.6rem 1rem;font-weight:600;background:#6366f1;color:white;}
  button:hover{background:#4f46e5;}
  .error{color:#f87171;font-size:0.85rem;min-height:1.2em;margin-top:0.25rem;}
  .msg{color:#34d399;font-size:0.85rem;min-height:1.2em;margin-top:0.25rem;}
  #app-section[hidden],#auth-section[hidden]{display:none;}
  .top-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;}
  ul#habits-list{list-style:none;padding:0;margin:0;}
  .habit-item{display:flex;align-items:center;gap:0.75rem;padding:0.6rem 0;border-bottom:1px solid #334155;}
  .habit-item .habit-name{flex:1;}
  .habit-item .habit-name.completed{text-decoration:line-through;color:#64748b;}
  #new-habit-form{display:flex;gap:0.5rem;margin-bottom:1rem;}
  #new-habit-form input{margin-bottom:0;}
  #loading-indicator{color:#94a3b8;font-size:0.9rem;}
  #setup-blocker{background:#7f1d1d;color:#fecaca;padding:1rem;border-radius:8px;margin-bottom:1rem;white-space:pre-wrap;font-family:monospace;font-size:0.8rem;}
</style>
</head>
<body>
<div class='wrap'>
  <h1>Habit Tracker</h1>
  <p class='sub'>Log daily habits and mark them complete.</p>

  <div id='setup-blocker' hidden></div>

  <section id='auth-section' class='card'>
    <div class='forms'>
      <div>
        <h2>Log in</h2>
        <form id='login-form'>
          <label for='login-email'>Email</label>
          <input type='email' id='login-email' required>
          <label for='login-password'>Password</label>
          <input type='password' id='login-password' required>
          <button type='submit' id='login-submit'>Log in</button>
          <div class='error' id='login-error'></div>
        </form>
      </div>
      <div>
        <h2>Sign up</h2>
        <form id='signup-form'>
          <label for='signup-email'>Email</label>
          <input type='email' id='signup-email' required>
          <label for='signup-password'>Password</label>
          <input type='password' id='signup-password' required minlength='6'>
          <button type='submit' id='signup-submit'>Sign up</button>
          <div class='error' id='signup-error'></div>
          <div class='msg' id='signup-message'></div>
        </form>
      </div>
    </div>
  </section>

  <section id='app-section' class='card' hidden>
    <div class='top-row'>
      <span id='user-email'></span>
      <button id='logout-btn' type='button'>Log out</button>
    </div>
    <form id='new-habit-form'>
      <input type='text' id='habit-name-input' placeholder='New habit name' required>
      <button type='submit' id='add-habit-btn'>Add</button>
    </form>
    <div id='loading-indicator' hidden>Loading habits...</div>
    <div class='error' id='app-error'></div>
    <ul id='habits-list'></ul>
  </section>
</div>

<script src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js'></script>
<script>
(function(){
  var SUPABASE_URL = 'https://ohcyjurhonzdvkqoellw.supabase.co';
  var SUPABASE_ANON_KEY = 'sb_publishable_YnS7FFbHc0at9QZ2jW5JpQ_T_JwkVUi';
  var client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  var TABLE = 'habit_tracker_habits';

  var authSection = document.getElementById('auth-section');
  var appSection = document.getElementById('app-section');
  var setupBlocker = document.getElementById('setup-blocker');
  var userEmailEl = document.getElementById('user-email');
  var habitsList = document.getElementById('habits-list');
  var loadingIndicator = document.getElementById('loading-indicator');
  var appError = document.getElementById('app-error');

  var loginForm = document.getElementById('login-form');
  var loginEmail = document.getElementById('login-email');
  var loginPassword = document.getElementById('login-password');
  var loginError = document.getElementById('login-error');

  var signupForm = document.getElementById('signup-form');
  var signupEmail = document.getElementById('signup-email');
  var signupPassword = document.getElementById('signup-password');
  var signupErrorEl = document.getElementById('signup-error');
  var signupMessage = document.getElementById('signup-message');

  var newHabitForm = document.getElementById('new-habit-form');
  var habitNameInput = document.getElementById('habit-name-input');
  var logoutBtn = document.getElementById('logout-btn');

  function showSignedOut(){
    authSection.hidden = false;
    appSection.hidden = true;
    userEmailEl.textContent = '';
    habitsList.innerHTML = '';
  }

  function showSignedIn(user){
    authSection.hidden = true;
    appSection.hidden = false;
    userEmailEl.textContent = user.email || '';
    loginError.textContent = '';
    signupErrorEl.textContent = '';
    signupMessage.textContent = '';
  }

  function describeError(err){
    if(!err) return 'Unknown error';
    var parts = [];
    if(err.status) parts.push('HTTP ' + err.status);
    if(err.code) parts.push('code ' + err.code);
    if(err.message) parts.push(err.message);
    return parts.join(' - ');
  }

  function isMissingTableError(err){
    if(!err) return false;
    var msg = (err.message || '') + ' ' + (err.details || '') + ' ' + (err.hint || '');
    return err.code === '42P01' || /relation .* does not exist/i.test(msg) || err.code === 'PGRST205' || err.code === 'PGRST116';
  }

  function renderHabits(rows){
    habitsList.innerHTML = '';
    rows.forEach(function(row){
      var li = document.createElement('li');
      li.className = 'habit-item';
      li.setAttribute('data-id', row.id);

      var checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.className = 'habit-complete-checkbox';
      checkbox.checked = !!row.completed;
      checkbox.addEventListener('change', function(){
        toggleComplete(row.id, !!row.completed);
      });

      var span = document.createElement('span');
      span.className = 'habit-name' + (row.completed ? ' completed' : '');
      span.textContent = row.name;

      li.appendChild(checkbox);
      li.appendChild(span);
      habitsList.appendChild(li);
    });
  }

  function fetchHabits(){
    loadingIndicator.hidden = false;
    appError.textContent = '';
    setupBlocker.hidden = true;
    return client.from(TABLE).select('*').order('created_at', { ascending: true }).then(function(res){
      loadingIndicator.hidden = true;
      if(res.error){
        if(isMissingTableError(res.error)){
          setupBlocker.hidden = false;
          setupBlocker.textContent = 'Setup blocker: table "' + TABLE + '" is not provisioned yet. Apply migrations/001-app.sql to the Supabase project. Details: ' + describeError(res.error);
          return;
        }
        appError.textContent = 'Could not load habits: ' + describeError(res.error);
        return;
      }
      renderHabits(res.data || []);
    });
  }

  function toggleComplete(id, current){
    appError.textContent = '';
    client.from(TABLE).update({ completed: !current }).eq('id', id).select().then(function(res){
      if(res.error){
        appError.textContent = 'Could not update habit: ' + describeError(res.error);
        return;
      }
      fetchHabits();
    });
  }

  newHabitForm.addEventListener('submit', function(e){
    e.preventDefault();
    var name = habitNameInput.value.trim();
    if(!name) return;
    appError.textContent = '';
    client.from(TABLE).insert({ name: name }).select().then(function(res){
      if(res.error){
        if(isMissingTableError(res.error)){
          setupBlocker.hidden = false;
          setupBlocker.textContent = 'Setup blocker: table "' + TABLE + '" is not provisioned yet. Apply migrations/001-app.sql to the Supabase project. Details: ' + describeError(res.error);
          return;
        }
        appError.textContent = 'Could not add habit: ' + describeError(res.error);
        return;
      }
      habitNameInput.value = '';
      fetchHabits();
    });
  });

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();
    loginError.textContent = '';
    var email = loginEmail.value.trim();
    var password = loginPassword.value;
    client.auth.signInWithPassword({ email: email, password: password }).then(function(res){
      if(res.error){
        loginError.textContent = describeError(res.error);
        return;
      }
      loginPassword.value = '';
    });
  });

  signupForm.addEventListener('submit', function(e){
    e.preventDefault();
    signupErrorEl.textContent = '';
    signupMessage.textContent = '';
    var email = signupEmail.value.trim();
    var password = signupPassword.value;
    client.auth.signUp({ email: email, password: password }).then(function(res){
      if(res.error){
        signupErrorEl.textContent = describeError(res.error);
        return;
      }
      if(res.data && res.data.user && !res.data.session){
        signupMessage.textContent = 'Confirmation required: check your email to confirm your account, then log in.';
        return;
      }
      signupPassword.value = '';
    });
  });

  logoutBtn.addEventListener('click', function(){
    client.auth.signOut();
  });

  client.auth.onAuthStateChange(function(event, session){
    if(session && session.user){
      showSignedIn(session.user);
      fetchHabits();
    } else {
      showSignedOut();
    }
  });

  client.auth.getSession().then(function(res){
    var session = res.data && res.data.session;
    if(session && session.user){
      showSignedIn(session.user);
      fetchHabits();
    } else {
      showSignedOut();
    }
  });
})();
</script>
</body>
</html>
