<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Word Counter</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden;margin:0;padding:0}img{max-width:100%;height:auto}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;background:#f8fafc;font-family:system-ui;color:#1e293b;padding:20px}
.card{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:380px;margin:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
textarea{width:100%;height:120px;font-size:16px;padding:8px;border:1px solid #ccc;border-radius:8px;resize:vertical}
.stats{display:flex;gap:16px;margin:12px 0;flex-wrap:wrap}
.stat{background:#f1f5f9;padding:12px;border-radius:8px;flex:1;min-width:80px;text-align:center}
.stat .n{font-size:28px;font-weight:700;color:#3b82f6}
.stat .l{font-size:12px;color:#64748b}
</style>
</head><body>
<div class="card">
<h1 data-testid="title">Word Counter</h1>
<textarea id="text" data-testid="text-input" placeholder="Type here..."></textarea>
<div class="stats">
<div class="stat"><div class="n" id="words" data-testid="word-count">0</div><div class="l">Words</div></div>
<div class="stat"><div class="n" id="chars" data-testid="char-count">0</div><div class="l">Chars</div></div>
<div class="stat"><div class="n" id="sentences" data-testid="sentence-count">0</div><div class="l">Sentences</div></div>
</div>
</div>
<script>
var ta=document.getElementById('text'),wordsEl=document.getElementById('words'),charsEl=document.getElementById('chars'),sentEl=document.getElementById('sentences');
window.appState={words:0,chars:0,sentences:0};
window.countText=function(){var t=ta.value;var words=t.trim()?t.trim().split(/\s+/).length:0;var chars=t.length;var sentences=t.trim()?(t.match(/[.!?]+/g)||[]).length:0;wordsEl.textContent=words;charsEl.textContent=chars;sentEl.textContent=sentences;window.appState={words:words,chars:chars,sentences:sentences};};
ta.addEventListener('input',window.countText);
</script>
</body></html>
