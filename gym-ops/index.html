.nav{display:flex;gap:.375rem;padding:.75rem;background:#0f172a;color:#fff;flex-wrap:wrap;align-items:center}

.form button:hover{background:#16a34a}

.stat{background:#fff;padding:1rem;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.08);margin-bottom:.75rem}
.stat .num{font-size:1.5rem;font-weight:700}
.empty{color:#94a3b8;font-style:italic;padding:.5rem}
.auth{max-width:420px;margin:2rem auto;padding:1.5rem;background:#fff;border-radius:12px;box-shadow:0 4px 12px rgba(0,0,0,.1)}

c.innerHTML='';
var invs=[],members=[],plans=[],memberships=[],allPayments=[];
try{invs=await app.store.list(app.config.tables.invoice);}catch(e){}
try{members=await app.store.list(app.config.tables.member);}catch(e){}
try{plans=await app.store.list(app.config.tables.plan);}catch(e){}
try{memberships=await app.store.list(app.config.tables.membership);}catch(e){}
try{allPayments=await app.store.list(app.config.tables.payment);}catch(e){}
var mOpts=members.map(function(m){return '<option value="'+m.id+'">'+String(m.name||'').replace(/</g,'<')+'</option>';}).join('');
var invOpts=invs.map(function(inv){return '<option value="'+inv.id+'">'+String(inv.number||inv.id||'').slice(0,8)+'</option>';}).join('');
var pOpts=plans.map(function(p){return '<option value="'+p.id+'">'+String(p.name||'').replace(/</g,'<')+'</option>';}).join('');
var rowsHtml='';
for(var i=0;i<invs.length;i++){var inv=invs[i];var lineItems=memberships.filter(function(m){return m.invoice_id===inv.id;});var total=0;for(var l=0;l<lineItems.length;l++){var pl=plans.find(function(p){return p.id===lineItems[l].plan_id;});total+=Number(pl?pl.price:0);}var invPayments=allPayments.filter(function(p){return p.invoice_id===inv.id;});var paid=app.utils.calc.sum(invPayments,'amount');var bal=total-paid;var status=total<=0.001?'draft':(bal<=0.001?'paid':'unpaid');rowsHtml+='<div class="row" data-testid="invoice-item" data-record-id="'+inv.id+'"><div><strong>Invoice</strong> <span class="pill '+status+'">'+status+'</span><div class="meta">Total <span data-testid="invoice-total">'+total.toFixed(2)+'</span> | Balance <span data-testid="invoice-balance">'+bal.toFixed(2)+'</span></div></div><button data-testid="invoice-pay" data-inv="'+inv.id+'" style="background:#22c55e;color:#fff;border:none;border-radius:6px;cursor:pointer;min-height:40px;padding:.4rem .75rem">Pay</button></div>';}
if(!invs.length)rowsHtml='<p class="empty">No invoices</p>';
var paymentsHtml=allPayments.map(function(p){return '<span data-testid="payment-amount-cell">'+Number(p.amount||0).toFixed(2)+'</span>';}).join(' ');
var html='<div class="view" data-testid="route-invoices"><h2>Invoices</h2>';
html+='<form class="form" data-testid="invoice-form" id="invoice-form">';
html+='<select data-testid="invoice-member" name="member_id"><option value="">Select member</option>'+mOpts+'</select>';
html+='<button data-testid="invoice-submit" type="submit">Create Invoice</button></form>';
html+='<form class="form" data-testid="line-form" id="line-form">';
html+='<select data-testid="line-invoice" name="invoice_id"><option value="">Select invoice</option>'+invOpts+'</select>';
html+='<select data-testid="line-plan" name="plan_id"><option value="">Select plan</option>'+pOpts+'</select>';
html+='<button data-testid="line-submit" type="submit">Add Line Item</button></form>';
html+='<div>'+rowsHtml+'</div>';
html+='<div data-testid="payment-form" id="payment-form" style="display:none;margin-top:1rem;padding:1rem;background:#fff;border-radius:8px"><h3>Record Payment</h3><input data-testid="payment-amount" type="number" step="0.01" placeholder="Amount" style="padding:.5rem;border:1px solid #cbd5e1;border-radius:6px;min-height:40px;font-size:16px;width:100%;margin-bottom:.5rem"><button data-testid="payment-submit" style="background:#22c55e;color:#fff;border:none;border-radius:6px;cursor:pointer;min-height:40px;padding:.5rem 1rem;width:100%">Submit Payment</button></div>';
html+='<div id="payments-list" style="display:none">'+paymentsHtml+'</div>';
html+='</div>';
c.innerHTML=html;
var payForm=c.querySelector('#payment-form');
c.querySelector('#invoice-form').addEventListener('submit',async function(e){e.preventDefault();var mId=c.querySelector('[data-testid="invoice-member"]').value;if(!mId)return;try{await app.store.create(app.config.tables.invoice,{member_id:mId,number:'INV-'+Date.now(),status:'unpaid'});}catch(err){console.error('create invoice failed',err.message);return;}await app.views.invoices.render();});
c.querySelector('#line-form').addEventListener('submit',async function(e){e.preventDefault();var invId=c.querySelector('[data-testid="line-invoice"]').value;if(!invId)return;var plId=c.querySelector('[data-testid="line-plan"]').value;if(!plId)return;var inv=invs.find(function(x){return x.id===invId;});if(!inv)return;try{await app.store.create(app.config.tables.membership,{member_id:inv.member_id,plan_id:plId,invoice_id:invId,status:'active'});}catch(err){console.error('create membership failed',err.message);return;}await app.views.invoices.render();});
c.querySelectorAll('[data-testid="invoice-pay"]').forEach(function(btn){btn.addEventListener('click',function(){window.__payInvId=btn.getAttribute('data-inv');payForm.style.display='block';});});
c.querySelector('[data-testid="payment-submit"]').addEventListener('click',async function(){var amt=c.querySelector('[data-testid="payment-amount"]').value;if(!amt||!window.__payInvId)return;try{await app.store.create(app.config.tables.payment,{invoice_id:window.__payInvId,amount:Number(amt)});}catch(err){console.error('create payment failed',err.message);return;}await app.views.invoices.render();});
}};
})(window.app=window.app||{});
</script>
<script>
(function(app){
app.views=app.views||{};

c.querySelector('#task-form').addEventListener('submit',async function(e){e.preventDefault();var title=c.querySelector('[data-testid="task-title"]').value;if(!title)return;try{await app.store.create(app.config.tables.task,{title:title,due_date:c.querySelector('[data-testid="task-due-date"]').value});}catch(err){console.error('create task failed',err.message);return;}await app.views.reports.render();});
}};
})(window.app=window.app||{});
</script>
<script>

'<input data-testid="login-email" type="email" placeholder="Email" autocomplete="email">'+

'<p class="notice" data-testid="signup-notice" style="display:none"></p></div></div>';
var ls=document.querySelector('[data-testid="login-submit"]');

<script>
(function(app){
app.session=null;
app.refreshAuthData=async function(session){
app.session=session;
if(!session){app.renderAuth();return;}
app.renderLayout();
await app.router.dispatch();
};
app.router.on('/dashboard',async function(){await app.views.dashboard.render();});
app.router.on('/members',async function(){await app.views.members.render();});
app.router.on('/classes',async function(){await app.views.classes.render();});
app.router.on('/trainers',async function(){await app.views.trainers.render();});
app.router.on('/attendance',async function(){await app.views.attendance.render();});
app.router.on('/payments',async function(){await app.views.payments.render();});
app.router.on('/invoices',async function(){await app.views.invoices.render();});
app.router.on('/reports',async function(){await app.views.reports.render();});
db.auth.onAuthStateChange((event, session) => setTimeout(() => app.refreshAuthData(session), 0));
app.init=function(){window.addEventListener('hashchange',function(){app.router.dispatch();});};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',app.init);else app.init();
})(window.app=window.app||{});
</script>
