<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Pomodoro Timer</title>
<link rel="manifest" href="manifest.json">
<style>
body{margin:0;padding:0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1a1a2e;color:#fff;font-family:system-ui}
#timer{font-size:64px;margin:20px}
button{font-size:18px;height:48px;padding:0 28px;margin:8px;border:none;border-radius:8px;background:#e94560;color:#fff;cursor:pointer}
#status{font-size:20px;margin:10px;min-height:28px}
#sessions{font-size:16px;color:#aaa;margin:10px}
</style>
</head>
<body>
<h1 data-testid="title">Pomodoro Timer</h1>
<div id="timer" data-testid="timer-display">25:00</div>
<button id="start-btn" data-testid="start-btn">Start</button>
<div id="status" data-testid="status">Ready to focus</div>
<div id="sessions" data-testid="sessions-display" data-record-id="">Sessions: 0</div>
<script>
var DURATION=25*60,remaining=DURATION,tickHandle=null,sessions=parseInt(localStorage.getItem('pomodoro-sessions')||'0',10);
var display=document.getElementById('timer'),statusEl=document.getElementById('status'),sessionsEl=document.getElementById('sessions');
window.appState={remaining:remaining,running:false,sessions:sessions,finished:false};
window.setSeconds=function(s){remaining=Math.max(0,s);updateDisplay();};
window.finishNow=function(){remaining=0;if(window.appState.running){finish();}};
function updateDisplay(){var m=Math.floor(remaining/60),s=remaining%60;display.textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;window.appState.remaining=remaining;}
function finish(){if(tickHandle){clearInterval(tickHandle);tickHandle=null;}window.appState.running=false;window.appState.finished=true;sessions++;localStorage.setItem('pomodoro-sessions',String(sessions));window.appState.sessions=sessions;sessionsEl.textContent='Sessions: '+sessions;sessionsEl.dataset.recordId='sessions-'+sessions;statusEl.textContent='Time is up! Session complete.';try{var ctx=new(window.AudioContext||window.webkitAudioContext)();var osc=ctx.createOscillator();var gain=ctx.createGain();osc.frequency.value=880;gain.gain.value=0.3;osc.connect(gain);gain.connect(ctx.destination);osc.start();osc.stop(ctx.currentTime+0.5);}catch(e){}}
function start(){if(window.appState.running)return;window.appState.running=true;window.appState.finished=false;statusEl.textContent='Focusing...';tickHandle=setInterval(function(){remaining--;if(remaining<=0){finish();}else{updateDisplay();}},1000);}
document.getElementById('start-btn').addEventListener('click',start);
sessionsEl.textContent='Sessions: '+sessions;sessionsEl.dataset.recordId='sessions-'+sessions;updateDisplay();
</script>
</body>
</html>
