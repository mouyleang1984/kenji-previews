<link rel="manifest" href="manifest.json">
<style>.tax-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.calc-line{background:#fff;padding:.6rem;border-radius:8px;margin-bottom:.4rem;display:flex;justify-content:space-between;align-items:center;min-height:44px}
.calc-line .label{color:#475569;font-size:.95rem}
.calc-line .val{font-weight:700;font-variant-numeric:tabular-nums}
.calc-line.refund .val{color:#16a34a}
.calc-line.due .val{color:#ef4444}
.mode-tabs{display:flex;gap:.5rem;margin-bottom:1rem}
.mode-tabs button{flex:1;min-height:44px;border:1px solid #cbd5e1;background:#fff;border-radius:8px;cursor:pointer;font-size:1rem}
.mode-tabs button.active{background:#0f172a;color:#fff}
@media(max-width:640px){.tax-grid{grid-template-columns:1fr}}</style>
