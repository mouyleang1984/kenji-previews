var format={cents:function(n){return '$'+(Number(n||0)/100).toFixed(2);},signedCents:function(n){var v=Number(n||0);return (v<0?'-$':'$')+Math.abs(v/100).toFixed(2);},num:function(n){return String(Number(n||0));},dayKey:function(d){var dt=new Date(d||Date.now());return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');}};


function norm(p){return String(p||'').replace(/^\/+/, '');}
function createRouter(routes){var handlers={};var first=norm((routes&&routes[0])||'');return{on:function(path,fn){handlers[norm(path)]=fn;},go:function(path){window.location.hash='#/'+norm(path);},current:function(){return window.location.hash.replace(/^#\/?/,'')||'';},dispatch:async function(){var path=this.current()||first;var fn=handlers[path]||handlers[first];if(fn)await fn();}};}


function clean(payload){var out={};for(var k in payload){var v=payload[k];out[k]=(v===''||v==null)?null:v;}return out;}
function createData(db,table,getSession){return{list:async function(){var r=await db.from(table).select('*').order('created_at',{ascending:false});if(r.error)throw new Error(r.error.message);return r.data||[];},filter:async function(f){var q=db.from(table).select('*');for(var k in f)q=q.eq(k,f[k]);var r=await q;if(r.error)throw new Error(r.error.message);return r.data||[];},get:async function(id){var r=await db.from(table).select('*').eq('id',id).single();if(r.error)throw new Error(r.error.message);return r.data;},create:async function(payload){var s=getSession();if(!s)throw new Error('no session');var body=Object.assign({owner_id:s.user.id},clean(payload));var r=await db.from(table).insert(body).select().single();if(r.error)throw new Error(r.error.message);var data=r.data;var rb=await db.from(table).select('id').eq('id',data.id).single();if(rb.error||!rb.data)throw new Error('Read-back failed for '+data.id);return data;},update:async function(id,patch){var r=await db.from(table).update(clean(patch)).eq('id',id).select().single();if(r.error)throw new Error(r.error.message);return r.data;},remove:async function(id){var r=await db.from(table).delete().eq('id',id);if(r.error)throw new Error(r.error.message);}};}


function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):s;}

function calcBracketTax(taxable,brackets){var tax=0,prev=0;if(!brackets||!brackets.length)return 0;for(var i=0;i<brackets.length;i++){var b=brackets[i];var hi=(b.up_to_cents===null||b.up_to_cents===undefined)?Infinity:b.up_to_cents;if(taxable<=prev)break;var layerTop=Math.min(taxable,hi);var layerAmount=layerTop-prev;if(layerAmount>0)tax+=Math.round(layerAmount*b.rate_bps/10000);prev=hi;if(taxable<=hi)break;}return tax;}


function calcGross(w2s,income1099,businessNet){var g=0;for(var i=0;i<(w2s||[]).length;i++)g+=Number(w2s[i].wages_cents||0);for(var j=0;j<(income1099||[]).length;j++)g+=Number(income1099[j].amount_cents||0);g+=Number(businessNet||0);return g;}
function calcAdjustments(adj,halfSe){return Number((adj&&adj.hsa_cents)||0)+Number((adj&&adj.ira_cents)||0)+Number((adj&&adj.student_loan_cents)||0)+Number(halfSe||0);}
function calcAgi(gross,adjustments){return gross-adjustments;}


function calcDeduction(standardCents,itemizedCents){return Math.max(Number(standardCents||0),Number(itemizedCents||0));}
function calcTaxableBeforeQbi(agi,deduction){return Math.max(0,agi-deduction);}
function calcTaxable(taxableBeforeQbi,qbiDeduction){return Math.max(0,taxableBeforeQbi-Number(qbiDeduction||0));}


function calcIncomeTax(taxable,brackets){return calcBracketTax(taxable,brackets);}


function calcCredits(credits,agi,filingStatus){var childCount=Number((credits&&credits.child_count)||0);var eduCount=Number((credits&&credits.education_count)||0);var eitcEligible=!!(credits&&credits.eitc_eligible);var child=childCount*200000;var education=eduCount*250000;var eitc=0;if(eitcEligible&&agi<=2000000)eitc=300000;return{non_refundable:child+education,refundable:eitc,child_tax_credit:child,education_credit:education,eitc:eitc};}
function applyCredits(incomeTax,nonRefundable,refundable){var nrApplied=Math.min(incomeTax,nonRefundable);var afterNr=incomeTax-nrApplied;var finalTax=afterNr-refundable;return{non_refundable_applied:nrApplied,refundable_total:refundable,credits_applied:nrApplied+refundable,final_tax:finalTax};}


// Self-employment tax applies only to net SE earnings above the $400 threshold, computed separately
// (simplified: 15.3% on net SE earnings, 50% deductible above the line).
function calcSeTax(seEarnings){var n=Number(seEarnings||0);if(n<40000)return{se_tax:0,deductible_half:0};var seTax=Math.round(n*0.153);var half=Math.round(seTax/2);return{se_tax:seTax,deductible_half:half};}


// QBI deduction is 20% of qualified business income capped by 20% of taxable income. The cap is
// asserted (cap_applies) so the gate can verify it binds when it should.
function calcQbi(qbiIncome,taxableBeforeQbi){var qbi=Math.round(0.20*Number(qbiIncome||0));var cap=Math.round(0.20*Number(taxableBeforeQbi||0));var deduction=Math.min(qbi,cap);return{qbi:qbi,cap:cap,qbi_deduction:deduction,cap_applies:cap<qbi};}


// Balance due or refund equals withholding plus estimated payments minus final tax (incl. SE tax).
// Positive = refund (overpaid), negative = balance due (owed). The sign must be right.
function calcBalance(withholding,estimated,finalTax,seTax){return Number(withholding||0)+Number(estimated||0)-(Number(finalTax||0)+Number(seTax||0));}


function computeReturn(input){
  var filingStatus=input.filing_status||'single';
  var brackets=app.bracketsFor(filingStatus,input.tax_year||TAX_YEAR);
  var standard=app.standardDeduction(filingStatus,input.tax_year||TAX_YEAR);
  var businessNet=0;
  if(input.business){businessNet=Number(input.business.income_cents||0)-Number(input.business.expenses_cents||0);var passThrough=['sole_prop','single_member_llc','s_corp','partnership'].indexOf(input.business.entity_type)>=0;if(!passThrough)businessNet=0;}
  var gross=calcGross(input.w2s,input.income_1099,businessNet);
  var seEarnings=0;
  for(var i=0;i<(input.income_1099||[]).length;i++){if(String(input.income_1099[i].kind||'').toUpperCase()==='NEC')seEarnings+=Number(input.income_1099[i].amount_cents||0);}
  if(input.business&&['sole_prop','single_member_llc'].indexOf(input.business.entity_type)>=0&&businessNet>0)seEarnings+=businessNet;
  var se=calcSeTax(seEarnings);
  var adjustments=calcAdjustments(input.adjustments,se.deductible_half);
  var agi=calcAgi(gross,adjustments);
  var itemized=Number(input.itemized_cents||0);
  var deduction=calcDeduction(standard,itemized);
  var taxableBeforeQbi=calcTaxableBeforeQbi(agi,deduction);
  var qbiIncome=seEarnings;
  var qbi=calcQbi(qbiIncome,taxableBeforeQbi);
  var taxable=calcTaxable(taxableBeforeQbi,qbi.qbi_deduction);
  var incomeTax=calcIncomeTax(taxable,brackets);
  var cr=calcCredits(input.credits,agi,filingStatus);
  var applied=applyCredits(incomeTax,cr.non_refundable,cr.refundable);
  var balance=calcBalance(input.withholding_cents,input.estimated_payments_cents,applied.final_tax,se.se_tax);
  return{gross:gross,adjustments:adjustments,agi:agi,deduction:deduction,itemized_used:itemized>standard,taxable_before_qbi:taxableBeforeQbi,qbi_deduction:qbi.qbi_deduction,qbi_cap:qbi.cap,qbi_cap_applies:qbi.cap_applies,taxable:taxable,income_tax:incomeTax,se_tax:se.se_tax,non_refundable_applied:applied.non_refundable_applied,refundable_total:applied.refundable_total,credits_applied:applied.credits_applied,final_tax:applied.final_tax,final_tax_with_se:applied.final_tax+se.se_tax,balance:balance,business_net:businessNet,se_earnings:seEarnings};
}

  }
