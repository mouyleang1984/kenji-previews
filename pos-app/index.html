var format = {
  cents: function(n) { return '$' + (Number(n || 0) / 100).toFixed(2); },
  num: function(n) { return String(Number(n || 0)); },
  dayKey: function(d) { var dt = new Date(d || Date.now()); return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); }
};

function norm(p) { return String(p || '').replace(/^\/+/, ''); }
function createRouter(routes) {
  var handlers = {};
  var first = norm((routes && routes[0]) || '');
  return {
    on: function(path, fn) { handlers[norm(path)] = fn; },
    go: function(path) { window.location.hash = '#/' + norm(path); },
    current: function() { return window.location.hash.replace(/^#\/?/, '') || ''; },
    dispatch: async function() { var path = this.current() || first; var fn = handlers[path] || handlers[first]; if (fn) await fn(); }
  };
}

function clean(payload) {
  var out = {};
  for (var k in payload) { var v = payload[k]; out[k] = (v === '' || v == null) ? null : v; }
  return out;
}
function createData(db, table, getSession) {
  return {
    list: async function() { var r = await db.from(table).select('*').order('created_at', { ascending: false }); if (r.error) throw new Error(r.error.message); return r.data || []; },
    filter: async function(f) { var q = db.from(table).select('*'); for (var k in f) q = q.eq(k, f[k]); var r = await q; if (r.error) throw new Error(r.error.message); return r.data || []; },
    get: async function(id) { var r = await db.from(table).select('*').eq('id', id).single(); if (r.error) throw new Error(r.error.message); return r.data; },
    create: async function(payload) { var s = getSession(); if (!s) throw new Error('no session'); var body = Object.assign({ owner_id: s.user.id }, clean(payload)); var r = await db.from(table).insert(body).select().single(); if (r.error) throw new Error(r.error.message); var data = r.data; var rb = await db.from(table).select('id').eq('id', data.id).single(); if (rb.error || !rb.data) throw new Error('Read-back failed for ' + data.id); return data; },
    update: async function(id, patch) { var r = await db.from(table).update(clean(patch)).eq('id', id).select().single(); if (r.error) throw new Error(r.error.message); return r.data; },
    remove: async function(id) { var r = await db.from(table).delete().eq('id', id); if (r.error) throw new Error(r.error.message); }
  };
}

function createAuth(db, hooks) {
  var session = null;
  var h = hooks || {};
  function refresh(sess) { session = sess; if (!sess) { if (h.onSignedOut) h.onSignedOut(); return Promise.resolve(); } return h.onSignedIn ? h.onSignedIn(sess) : Promise.resolve(); }
  db.auth.onAuthStateChange(function(event, sess) { if (event === 'INITIAL_SESSION') setTimeout(function() { refresh(sess); }, 0); });
  return {
    current: function() { return session; },
    refresh: refresh,
    signIn: async function(email, pw) { var r = await db.auth.signInWithPassword({ email: email, password: pw }); if (r.error) throw r.error; if (r.data.session) await refresh(r.data.session); else throw new Error('No session'); },
    signUp: async function(email, pw) { var r = await db.auth.signUp({ email: email, password: pw }); if (r.error) throw r.error; if (r.data.session) await refresh(r.data.session); return r.data; },
    signOut: async function() { await db.auth.signOut(); await refresh(null); }
  };
}

function cap(s) { return s ? s.charAt(0).toUpperCase() + s.slice(1) : s; }
function shellPath(routes) { return (window.location.hash.replace(/^#\/?/, '') || String(routes[0] || '')).replace(/^\/+/, ''); }
function renderShell(routes, onLogout) {
  var nav = '';
  for (var i = 0; i < routes.length; i++) nav += '<a data-testid="nav-' + routes[i] + '" href="#/' + routes[i] + '">' + cap(routes[i]) + '</a>';
  document.getElementById('app').innerHTML = '<nav class="nav" data-testid="nav">' + nav + '<span class="spacer"></span><button class="btn-danger" data-testid="logout-btn">Log out</button></nav><main id="content"></main>';
  var want = '#/' + shellPath(routes);
  var links = document.querySelectorAll('.nav a');
  for (var j = 0; j < links.length; j++) links[j].className = links[j].getAttribute('href') === want ? 'active' : '';
  var lo = document.querySelector('[data-testid="logout-btn"]');
  if (lo) lo.addEventListener('click', onLogout);
}
function activeLink(path) {
  var want = '#/' + String(path || '').replace(/^\/+/, '');
  var links = document.querySelectorAll('.nav a');
  for (var j = 0; j < links.length; j++) links[j].className = links[j].getAttribute('href') === want ? 'active' : '';
}

var calc = {
  lineTotal: function(qty, unitPriceCents, lineDiscountCents) { return Number(qty) * Number(unitPriceCents) - Number(lineDiscountCents || 0); },
  saleTotals: function(lines, taxBps, orderDiscountCents) {
    var sub = 0;
    for (var i = 0; i < (lines || []).length; i++) sub += this.lineTotal(lines[i].qty, lines[i].unit_price_cents, lines[i].line_discount_cents);
    var tax = Math.round(sub * Number(taxBps || 0) / 10000);
    return { subtotal: sub, tax: tax, total: sub + tax - Number(orderDiscountCents || 0) };
  },
  sum: function(rows, field) { return (rows || []).reduce(function(s, r) { return s + Number(r[field] || 0); }, 0); }
};
var dateUtil = { dayKey: function(d) { var dt = new Date(d || Date.now()); return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); } };

function layer(table) { return createData(db, table, function() { return app.session; }); }
var store = {

var components = {

var pos = {
  activeShift: async function() {
    var r = await db.from('pos_shifts').select('*').eq('status','open').order('opened_at',{ascending:false}).limit(1);
    if (r.error) throw new Error(r.error.message);
    return (r.data || [])[0] || null;
  },
  completeSale: async function(cart, shift, tenderCents, method, customerId, orderDiscountCents) {
    if (!cart || !cart.length) throw new Error('CART_EMPTY');
    var s = app.session; if (!s) throw new Error('no session');
    var lines = cart.map(function(l) { return { product_id: l.product_id, qty: Number(l.qty), unit_price_cents: Number(l.unit_price_cents), line_discount_cents: Number(l.line_discount_cents || 0) }; });
    var totals = calc.saleTotals(lines, Number(shift.tax_bps || 0), Number(orderDiscountCents || 0));
    if (Number(tenderCents) < totals.total) throw new Error('INSUFFICIENT_TENDER');
    var saleBody = { owner_id: s.user.id, shift_id: shift.id || null, customer_id: customerId || null, subtotal_cents: totals.subtotal, tax_cents: totals.tax, order_discount_cents: Number(orderDiscountCents || 0), total_cents: totals.total, status: 'completed' };
    var rs = await db.from('pos_sales').insert(saleBody).select().single(); if (rs.error) throw new Error(rs.error.message);
    var sale = rs.data;
    var rb = await db.from('pos_sales').select('id').eq('id', sale.id).single(); if (rb.error || !rb.data) throw new Error('Read-back failed for sale ' + sale.id);
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i]; var lt = ln.qty * ln.unit_price_cents - ln.line_discount_cents;
      var ri = await db.from('pos_sale_items').insert({ owner_id: s.user.id, sale_id: sale.id, product_id: ln.product_id, qty: ln.qty, unit_price_cents: ln.unit_price_cents, line_discount_cents: ln.line_discount_cents, line_total_cents: lt }).select().single(); if (ri.error) throw new Error(ri.error.message);
      var pg = await db.from('pos_products').select('id,stock').eq('id', ln.product_id).single(); if (pg.error) throw new Error(pg.error.message);
      var newStock = Number(pg.data.stock || 0) - ln.qty;
      var pu = await db.from('pos_products').update({ stock: newStock }).eq('id', ln.product_id); if (pu.error) throw new Error(pu.error.message);
      var sm = await db.from('pos_stock_movements').insert({ owner_id: s.user.id, product_id: ln.product_id, sale_id: sale.id, delta: -ln.qty, reason: 'sale' }).select().single(); if (sm.error) throw new Error(sm.error.message);
    }
    var pp = await db.from('pos_payments').insert({ owner_id: s.user.id, sale_id: sale.id, method: method || 'cash', amount_cents: Number(tenderCents) }).select().single(); if (pp.error) throw new Error(pp.error.message);
    return { sale: sale, change: Number(tenderCents) - totals.total, totals: totals };
  },
  refundSale: async function(saleId, method) {
    var s = app.session; if (!s) throw new Error('no session');
    var rs = await db.from('pos_sales').select('*').eq('id', saleId).single(); if (rs.error || !rs.data) throw new Error('sale not found');
    var sale = rs.data; if (sale.status !== 'completed') throw new Error('ALREADY_REFUNDED');
    var pp = await db.from('pos_payments').insert({ owner_id: s.user.id, sale_id: sale.id, method: method || 'refund', amount_cents: -Number(sale.total_cents) }).select().single(); if (pp.error) throw new Error(pp.error.message);
    var items = await db.from('pos_sale_items').select('*').eq('sale_id', sale.id); if (items.error) throw new Error(items.error.message);
    for (var i = 0; i < (items.data || []).length; i++) {
      var it = items.data[i];
      var pg = await db.from('pos_products').select('id,stock').eq('id', it.product_id).single(); if (pg.error) throw new Error(pg.error.message);
      var newStock = Number(pg.data.stock || 0) + Number(it.qty);
      var pu = await db.from('pos_products').update({ stock: newStock }).eq('id', it.product_id); if (pu.error) throw new Error(pu.error.message);
      var sm = await db.from('pos_stock_movements').insert({ owner_id: s.user.id, product_id: it.product_id, sale_id: sale.id, delta: Number(it.qty), reason: 'refund' }).select().single(); if (sm.error) throw new Error(sm.error.message);
    }
    var su = await db.from('pos_sales').update({ status: 'refunded' }).eq('id', sale.id); if (su.error) throw new Error(su.error.message);
    return { sale: sale };
  }
};

function renderAuth() {
  document.getElementById('app').innerHTML = '<div class="auth" data-testid="auth-view">' +
    '<div data-testid="login-form"><h2>Log in</h2>' +

    catch (e) { var n = document.querySelector('[data-testid="signup-notice"]'); n.textContent = 'Login failed: ' + (e.message || e); n.style.display = 'block'; }
  });
  document.querySelector('[data-testid="signup-submit"]').addEventListener('click', async function() {

app.views = { register: registerView, products: productsView, inventory: inventoryView, customers: customersView, sales: salesView, reports: reportsView, suppliers: suppliersView, settings: settingsView };

// ============ INIT ============
app.router = createRouter(config.routes);
app.router.on('/register', async function() { await registerView.render(); });
app.router.on('/products', async function() { await productsView.render(); });
app.router.on('/inventory', async function() { await inventoryView.render(); });
app.router.on('/customers', async function() { await customersView.render(); });
app.router.on('/sales', async function() { await salesView.render(); });
app.router.on('/reports', async function() { await reportsView.render(); });
app.router.on('/suppliers', async function() { await suppliersView.render(); });
app.router.on('/settings', async function() { await settingsView.render(); });

async function renderApp(session) {
  app.session = session;
  renderShell(config.routes, function() { app.auth.signOut(); });
  await app.router.dispatch();
}

app.auth = createAuth(db, {
  onSignedIn: async function(session) { await renderApp(session); },
  onSignedOut: function() { app.session = null; renderAuth(); }
});

injectStyles();
window.addEventListener('hashchange', function() { app.router.dispatch(); });
})();</script>
