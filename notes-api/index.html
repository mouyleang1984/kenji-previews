<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes API</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#f4f4f5;color:#18181b;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem}
.card{background:#fff;border-radius:12px;box-shadow:0 1px 3px rgba(0,0,0,.1);padding:2rem;max-width:500px;width:100%}
h1{font-size:1.5rem;margin-bottom:1rem}
.input-row{display:flex;gap:.5rem;margin-bottom:1rem}
.input-row input{flex:1;padding:.625rem;border:1px solid #e4e4e7;border-radius:8px;font-size:1rem}
button{padding:.625rem 1rem;background:#18181b;color:#fff;border:none;border-radius:8px;font-size:1rem;cursor:pointer}
button:hover{background:#27272a}
.note-row{padding:.75rem;border:1px solid #e4e4e7;border-radius:8px;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center}
.note-row button{padding:.25rem .5rem;font-size:.75rem;background:#dc2626}
#notes-list{min-height:2rem}
</style>
</head>
<body>
<div class="card" data-testid="app">
<h1>Notes API</h1>
<div class="input-row">
<input type="text" data-testid="note-input" placeholder="Add a note...">
<button data-testid="note-add">Add</button>
<button data-testid="note-refresh">Load Notes</button>
</div>
<div id="notes-list" data-testid="notes-list"><p style="color:#71717a;font-size:.875rem">Click Load Notes to fetch from the API.</p></div>
</div>
<script>
function isServerMode(){return location.protocol==='http:'||location.protocol==='https:'}
async function api(method,path,body){
  if(!isServerMode())return null;
  try{
    var res=await fetch(path,{method:method,headers:{'Content-Type':'application/json','Authorization':'Bearer demo-token-6789'},body:body?JSON.stringify(body):undefined});
    if(!res.ok)return null;
    return await res.json();
  }catch(e){return null}
}
async function loadNotes(){
  var notes=await api('GET','/api/notes');
  if(!notes||!Array.isArray(notes))return;
  var list=document.getElementById('notes-list');
  while(list.firstChild)list.removeChild(list.firstChild);
  notes.forEach(function(note){
    var row=document.createElement('div');
    row.className='note-row';row.setAttribute('data-testid','note-row');
    var span=document.createElement('span');span.textContent=note.text;
    var del=document.createElement('button');del.textContent='Delete';del.setAttribute('data-testid','note-delete');
    del.addEventListener('click',async function(){await api('DELETE','/api/notes/'+note.id);loadNotes()});
    row.appendChild(span);row.appendChild(del);list.appendChild(row);
  });
}
document.querySelector('[data-testid="note-add"]').addEventListener('click',async function(){
  var input=document.querySelector('[data-testid="note-input"]');
  if(!input.value.trim())return;
  await api('POST','/api/notes',{text:input.value});
  input.value='';loadNotes();
});
document.querySelector('[data-testid="note-refresh"]').addEventListener('click',loadNotes);
</script>
</body>
</html>
