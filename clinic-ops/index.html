c.querySelector('#shift-form').addEventListener('submit',async function(e){e.preventDefault();try{await app.store.create(app.config.tables.shift,{staff_id:c.querySelector('[data-testid="shift-staff"]').value,start_ts:c.querySelector('[data-testid="shift-start"]').value,end_ts:c.querySelector('[data-testid="shift-end"]').value});}catch(err){console.error('create shift failed',err.message);return;}await app.views.staff.render();});
}};

};
