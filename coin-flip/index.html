<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Coin Flip</title>
<link rel="manifest" href="data:application/manifest+json,%7B%0A%20%20%22name%22%3A%20%22Coin%20Flip%22%2C%0A%20%20%22short_name%22%3A%20%22CoinFlip%22%2C%0A%20%20%22start_url%22%3A%20%22.%2Findex.html%22%2C%0A%20%20%22scope%22%3A%20%22.%2F%22%2C%0A%20%20%22display%22%3A%20%22standalone%22%2C%0A%20%20%22theme_color%22%3A%20%22%231e293b%22%2C%0A%20%20%22background_color%22%3A%20%22%231e293b%22%2C%0A%20%20%22icons%22%3A%20%5B%0A%20%20%20%20%7B%0A%20%20%20%20%20%20%22src%22%3A%20%22data%3Aimage%2Fsvg%2Bxml%2C%253Csvg%2520xmlns%253D%2522http%253A%252F%252Fwww.w3.org%252F2000%252Fsvg%2522%2520width%253D%2522192%2522%2520height%253D%2522192%2522%253E%253Crect%2520width%253D%2522192%2522%2520height%253D%2522192%2522%2520fill%253D%2522%25231e293b%2522%252F%253E%253Ccircle%2520cx%253D%252296%2522%2520cy%253D%252296%2522%2520r%253D%252264%2522%2520fill%253D%2522%2523d4af37%2522%252F%253E%253C%252Fsvg%253E%22%2C%0A%20%20%20%20%20%20%22sizes%22%3A%20%22192x192%22%2C%0A%20%20%20%20%20%20%22type%22%3A%20%22image%2Fsvg%2Bxml%22%2C%0A%20%20%20%20%20%20%22purpose%22%3A%20%22any%20maskable%22%0A%20%20%20%20%7D%0A%20%20%5D%0A%7D">
<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden;margin:0;padding:0}img{max-width:100%;height:auto}
:root{--gold:#d4af37;--ink:#1e293b;--bg:#1e293b}
html{box-sizing:border-box;width:100%;height:100%;overflow-x:clip}*,*:before,*:after{box-sizing:inherit}body{height:100dvh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;background:var(--bg);color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;width:100%;max-width:390px;margin:0 auto;padding:0;overflow-x:clip}
.wrap{display:flex;flex-direction:column;align-items:center;width:100%;max-width:390px;padding:24px 16px 0;flex:1 1 auto;min-height:0;overflow:clip}
h1{font-size:22px;margin:0 0 16px;text-align:center}
.coin-stage{width:180px;height:180px;perspective:600px;margin:8px auto 24px}
.coin{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform 1.1s cubic-bezier(.2,.8,.2,1)}
.coin.flipping{transform:rotateY(var(--turn,1800deg))}
.face{position:absolute;inset:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--gold);color:var(--ink);border:4px solid #b8860b;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.face.tails{transform:rotateY(180deg)}
.choice{display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;margin:0 auto 8px}
.choice-label{font-size:13px;opacity:.8;text-align:center}
.seg{display:flex;gap:10px;width:100%}
.seg button{flex:1;min-height:48px;font-size:16px;font-weight:700;border:2px solid rgba(255,255,255,.25);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;cursor:pointer;padding:10px 0}
.seg button[aria-pressed="true"]{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.result{font-size:18px;font-weight:700;min-height:24px;text-align:center;margin:4px 0}
.stats{display:flex;gap:24px;font-size:15px;justify-content:center;margin:8px 0}
.spacer{flex:1}
.controls{flex:0 0 auto;margin-top:auto;width:100%;max-width:390px;padding:16px 16px max(16px,env(safe-area-inset-bottom));box-sizing:border-box}
#flip-btn{width:100%;min-height:48px;font-size:18px;font-weight:700;border:none;border-radius:12px;background:var(--gold);color:var(--ink);cursor:pointer;padding:12px}
#flip-btn:disabled{background:rgba(255,255,255,.12);color:rgba(255,255,255,.4);cursor:not-allowed}
#last{font-size:13px;opacity:.75;text-align:center;margin-top:10px}
</style>
</head><body>
<div class="wrap">
  <h1 data-testid="title">Coin Flip</h1>
  <div class="coin-stage" data-testid="coin-stage">
    <div class="coin" id="coin" data-testid="coin">
      <div class="face heads" data-testid="face-heads">Heads</div>
      <div class="face tails" data-testid="face-tails">Tails</div>
    </div>
  </div>
  <div class="result" id="result" data-testid="result">Pick a side</div>
  <div class="stats"><div>Heads: <span id="heads" data-testid="heads-count">0</span></div><div>Tails: <span id="tails" data-testid="tails-count">0</span></div></div>
  <div class="spacer"></div>
</div>
<div class="controls">
  <div class="choice">
    <div class="choice-label">Choose your side</div>
    <div class="seg" role="group" aria-label="Choose side" data-testid="choice">
      <button type="button" id="pick-heads" data-testid="pick-heads" aria-pressed="false">Heads</button>
      <button type="button" id="pick-tails" data-testid="pick-tails" aria-pressed="false">Tails</button>
    </div>
  </div>
  <button id="flip-btn" data-testid="flip-btn" disabled>Flip</button>
  <div id="last" data-testid="last-flip" data-record-id="">No flips yet</div>
</div>
<script>
var counts=JSON.parse(localStorage.getItem('coin-counts')||'{"heads":0,"tails":0}');
var coinEl=document.getElementById('coin'),headsEl=document.getElementById('heads'),tailsEl=document.getElementById('tails'),lastEl=document.getElementById('last'),resultEl=document.getElementById('result'),flipBtn=document.getElementById('flip-btn'),pickHeads=document.getElementById('pick-heads'),pickTails=document.getElementById('pick-tails');
var choice=null;
window.appState={result:null,heads:counts.heads,tails:counts.tails,choice:null};
function setChoice(side){choice=side;window.appState.choice=side;pickHeads.setAttribute('aria-pressed',String(side==='heads'));pickTails.setAttribute('aria-pressed',String(side==='tails'));flipBtn.disabled=false;resultEl.textContent='You chose '+side;}
pickHeads.addEventListener('click',function(){setChoice('heads');});
pickTails.addEventListener('click',function(){setChoice('tails');});
window.flipCoin=function(){if(!choice)return null;var r=choice;coinEl.classList.remove('flipping');void coinEl.offsetWidth;coinEl.style.setProperty('--turn',String(1800+(r==='tails'?180:0))+'deg');coinEl.classList.add('flipping');counts[r]++;localStorage.setItem('coin-counts',JSON.stringify(counts));headsEl.textContent=counts.heads;tailsEl.textContent=counts.tails;resultEl.textContent='Result: '+r;lastEl.textContent='Last: '+r;lastEl.dataset.recordId='flip-'+counts.heads+'-'+counts.tails;window.appState.result=r;window.appState.heads=counts.heads;window.appState.tails=counts.tails;return r;};
window.setChoice=setChoice;
flipBtn.addEventListener('click',window.flipCoin);
headsEl.textContent=counts.heads;tailsEl.textContent=counts.tails;
</script>
</body></html>
