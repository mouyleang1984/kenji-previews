<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Coin Flip</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden;margin:0;padding:0}img{max-width:100%;height:auto}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1e293b;color:#fff;font-family:system-ui}
#coin{font-size:80px;margin:16px;min-height:96px}
button{font-size:18px;height:48px;padding:0 28px;border:none;border-radius:8px;background:#f59e0b;color:#1e293b;cursor:pointer;font-weight:700}
.stats{display:flex;gap:24px;margin:12px;font-size:16px}
</style>
</head><body>
<h1 data-testid="title">Coin Flip</h1>
<div id="coin" data-testid="coin-display">🪙</div>
<button id="flip-btn" data-testid="flip-btn">Flip</button>
<div class="stats"><div>Heads: <span id="heads" data-testid="heads-count">0</span></div><div>Tails: <span id="tails" data-testid="tails-count">0</span></div></div>
<div id="last" data-testid="last-flip" data-record-id="">No flips yet</div>
<script>
var counts=JSON.parse(localStorage.getItem('coin-counts')||'{"heads":0,"tails":0}');
var coinEl=document.getElementById('coin'),headsEl=document.getElementById('heads'),tailsEl=document.getElementById('tails'),lastEl=document.getElementById('last');
window.appState={result:null,heads:counts.heads,tails:counts.tails};
window.flipCoin=function(){var r=Math.random()<0.5?'heads':'tails';coinEl.textContent=r==='heads'?' Heads':'Tails';counts[r]++;localStorage.setItem('coin-counts',JSON.stringify(counts));headsEl.textContent=counts.heads;tailsEl.textContent=counts.tails;lastEl.textContent='Last: '+r;lastEl.dataset.recordId='flip-'+counts.heads+'-'+counts.tails;window.appState.result=r;window.appState.heads=counts.heads;window.appState.tails=counts.tails;};
document.getElementById('flip-btn').addEventListener('click',window.flipCoin);
headsEl.textContent=counts.heads;tailsEl.textContent=counts.tails;
</script>
</body></html>
