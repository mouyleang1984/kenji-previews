if(!invs.length)rowsHtml='<p class="empty">No invoices</p>';

html+='<div>'+rowsHtml+'</div>';
html+='<div data-testid="payment-form" id="payment-form" style="display:none;margin-top:1rem;padding:1rem;background:#fff;border-radius:8px"><h3>Record Payment</h3><input data-testid="payment-amount" type="number" step="0.01" placeholder="Amount" style="padding:.5rem;border:1px solid #cbd5e1;border-radius:6px;min-height:40px;font-size:16px;width:100%;margin-bottom:.5rem"><button data-testid="payment-submit" style="background:#16a34a;color:#fff;border:none;border-radius:6px;cursor:pointer;min-height:40px;padding:.5rem 1rem;width:100%">Submit Payment</button></div>';

c.querySelector('#invoice-form').addEventListener('submit',async function(e){e.preventDefault();var evId=c.querySelector('[data-testid="invoice-event"]').value;if(!evId)return;try{await app.store.create(app.config.tables.invoice,{event_id:evId,number:'INV-'+Date.now(),status:'unpaid'});}catch(err){console.error('create invoice failed',err.message);return;}await app.views.invoices.render();});
c.querySelectorAll('[data-testid="invoice-pay"]').forEach(function(btn){btn.addEventListener('click',function(){window.__payInvId=btn.getAttribute('data-inv');payForm.style.display='block';});});
c.querySelector('[data-testid="payment-submit"]').addEventListener('click',async function(){var amt=c.querySelector('[data-testid="payment-amount"]').value;if(!amt||!window.__payInvId)return;try{await app.store.create(app.config.tables.payment,{invoice_id:window.__payInvId,amount:Number(amt)});}catch(err){console.error('create payment failed',err.message);return;}await app.views.invoices.render();});
}};
})(window.app=window.app||{});
</script>
<script>

<script>
(function(app){
app.session=null;
app.refreshAuthData=async function(session){
app.session=session;
if(!session){app.renderAuth();return;}
var a=document.getElementById('app');
app.renderLayout();
await app.router.dispatch();
};
app.router.on('/dashboard',async function(){await app.views.dashboard.render();});
app.router.on('/clients',async function(){await app.views.clients.render();});
app.router.on('/events',async function(){await app.views.events.render();});
app.router.on('/spaces',async function(){await app.views.spaces.render();});
app.router.on('/bookings',async function(){await app.views.bookings.render();});
app.router.on('/staff',async function(){await app.views.staff.render();});
app.router.on('/invoices',async function(){await app.views.invoices.render();});
app.router.on('/reports',async function(){await app.views.reports.render();});
db.auth.onAuthStateChange((event, session) => setTimeout(() => app.refreshAuthData(session), 0));
app.init=function(){window.addEventListener('hashchange',function(){app.router.dispatch();});};
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',app.init);else app.init();
})(window.app=window.app||{});
</script>
