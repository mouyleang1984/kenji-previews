<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>BMI Calculator</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden;margin:0;padding:0}img{max-width:100%;height:auto}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;background:#f0fdf4;font-family:system-ui;color:#222;padding:20px}
.card{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:380px;margin:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
label{display:block;margin:10px 0 4px;font-size:14px;font-weight:600}
input{width:100%;height:44px;font-size:18px;padding:0 8px;border:1px solid #ccc;border-radius:8px}
button{width:100%;height:48px;font-size:18px;margin-top:16px;border:none;border-radius:8px;background:#16a34a;color:#fff;cursor:pointer}
#bmi{font-size:36px;font-weight:700;color:#16a34a;margin:12px 0}
#cat{font-size:18px;font-weight:600}
</style>
</head><body>
<div class="card">
<h1 data-testid="title">BMI Calculator</h1>
<label for="height">Height (cm)</label>
<input id="height" data-testid="height-input" type="number" inputmode="decimal" value="170">
<label for="weight">Weight (kg)</label>
<input id="weight" data-testid="weight-input" type="number" inputmode="decimal" value="70">
<button id="calc-btn" data-testid="calc-btn">Calculate</button>
<div id="bmi" data-testid="bmi-display">--</div>
<div id="cat" data-testid="cat-display">Enter values and calculate</div>
<div id="saved" data-testid="saved-display" data-record-id="">No saved BMI</div>
</div>
<script>
function calc(){var h=parseFloat(document.getElementById('height').value)||0,w=parseFloat(document.getElementById('weight').value)||0;if(h<=0||w<=0)return;var m=h/100;var bmi=w/(m*m);var cat=bmi<18.5?'Underweight':bmi<25?'Normal':bmi<30?'Overweight':'Obese';document.getElementById('bmi').textContent=bmi.toFixed(1);document.getElementById('cat').textContent=cat;window.appState={bmi:Math.round(bmi*10)/10,category:cat,height:h,weight:w};localStorage.setItem('bmi-last',JSON.stringify(window.appState));var s=document.getElementById('saved');s.textContent='Last BMI: '+bmi.toFixed(1)+' ('+cat+')';s.dataset.recordId='bmi-'+Math.round(bmi*10);}
document.getElementById('calc-btn').addEventListener('click',calc);
window.appState={bmi:0,category:''};
var last=localStorage.getItem('bmi-last');if(last){try{var p=JSON.parse(last);document.getElementById('saved').textContent='Last BMI: '+p.bmi+' ('+p.category+')';document.getElementById('saved').dataset.recordId='bmi-'+Math.round(p.bmi*10);}catch(e){}}
</script>
</body></html>
