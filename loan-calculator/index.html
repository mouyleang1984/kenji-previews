<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loan Calculator</title><link rel="manifest" href="manifest.json"><style>*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden;margin:0;padding:0}img{max-width:100%;height:auto}body{font-family:system-ui;padding:24px;background:#fff;color:#0a0a0a}main{max-width:420px;margin:32px auto}form,label{display:grid;gap:12px}label{margin:12px 0}input,button{font:inherit;min-height:48px;width:100%;padding:10px;border:1px solid #aaa;border-radius:6px}button{background:#0a0a0a;color:#fff}output{display:block;font-size:32px;margin-top:24px}</style></head><body><main><h1>Loan Calculator</h1><form data-testid="calculator-form"><label>Loan amount<input data-testid="value-0" type="number" min="0" step="any" required value="1200"></label><label>Annual interest (%)<input data-testid="value-1" type="number" min="0" step="any" required value="0"></label><label>Term (months)<input data-testid="value-2" type="number" min="1" step="any" required value="12"></label><button data-testid="calculate" type="submit">Calculate</button></form><p data-testid="error" role="alert"></p><output data-testid="result" aria-live="polite">0.00</output></main><script>var form=document.querySelector("[data-testid=calculator-form]"),output=document.querySelector("[data-testid=result]"),message=document.querySelector("[data-testid=error]");form.addEventListener("submit",function(event){event.preventDefault();var values=Array.from(form.querySelectorAll("input")).map(function(el){return Number(el.value)}),a=values[0],b=values[1],c=values[2];if(values.some(function(v){return !Number.isFinite(v)||v<0})||(values.length===3&&c<=0)){message.textContent="Enter valid nonnegative amounts and a positive term.";return;}var result=b===0?a/c:(a*(b/1200))/(1-Math.pow(1+b/1200,-c));message.textContent="";output.textContent=result.toFixed(2);});</script></body></html>
