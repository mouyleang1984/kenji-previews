<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agency Operations</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a}
.nav{display:flex;gap:.5rem;padding:1rem;background:#1e293b;color:#fff;flex-wrap:wrap}
.nav a{color:#cbd5e1;cursor:pointer;text-decoration:none;padding:.375rem .75rem;border-radius:6px}
.nav a:hover{background:#334155;color:#fff}
.nav a.active{background:#3b82f6;color:#fff}
.view{padding:1.5rem;max-width:960px;margin:0 auto}
.view h2{margin-bottom:1rem;font-size:1.5rem}
.form{display:grid;gap:.5rem;margin-bottom:1.5rem;padding:1rem;background:#fff;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.form input,.form select,.form textarea{padding:.5rem;border:1px solid #cbd5e1;border-radius:6px;font-size:1rem}
.form button{padding:.5rem 1rem;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer;font-size:1rem}
.form button:hover{background:#2563eb}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.1)}
th,td{padding:.625rem;text-align:left;border-bottom:1px solid #e2e8f0}
th{background:#f1f5f9;font-size:.875rem;text-transform:uppercase}
td{font-size:.95rem}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem}
.stat-card{background:#fff;padding:1.5rem;border-radius:8px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.stat-card h3{font-size:.875rem;text-transform:uppercase;color:#64748b;margin-bottom:.5rem}
.stat-card .num{font-size:2rem;font-weight:700}
.empty{color:#94a3b8;font-style:italic;padding:1rem}
button[data-testid$="-delete"]{padding:.25rem .5rem;font-size:.75rem;background:#ef4444;color:#fff;border:none;border-radius:4px;cursor:pointer}
@media(max-width:640px){.view{padding:1rem}.nav{font-size:.875rem}.nav a{padding:.25rem .5rem}}
</style>
</head>
<body>
<div id="app" data-testid="app"></div>
<script>
(function(A){
  A.utils=A.utils||{};
  A.utils.dom={
    el:function(html){var d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;},
    clear:function(node){while(node.firstChild)node.removeChild(node.firstChild);},
    on:function(node,evt,fn){node.addEventListener(evt,fn);}
  };
})(window.App=window.App||{});
</script>
<script>
(function(A){
  A.utils=A.utils||{};
  A.utils.format={
    date:function(d){if(!d)return '';var dt=new Date(d);return isNaN(dt)?'':dt.toLocaleDateString();},
    money:function(n){return '$'+(Number(n||0)).toFixed(2);},
    truncate:function(s,n){s=String(s||'');return s.length>n?s.slice(0,n)+'...':s;}
  };
})(window.App=window.App||{});
</script>
<script>
(function(A){
  A.utils=A.utils||{};
  A.utils.validate={
    required:function(val){return val!=null&&String(val).trim()!=='';},
    email:function(val){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(val||''));},
    positive:function(val){return Number(val)>=0;}
  };
})(window.App=window.App||{});
</script>
<script>
(function(A){
  var KEY='agency_ops_db';
  A.db={
    load:function(){try{return JSON.parse(localStorage.getItem(KEY))||{};}catch(e){return{};}},
    save:function(data){try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){}},
    key:KEY
  };
})(window.App=window.App||{});
</script>
<script>
(function(A){
  var db=A.db;
  var ENTITIES=['clients','projects','tasks','notes','expenses'];
  function read(){var data=db.load();ENTITIES.forEach(function(e){if(!Array.isArray(data[e]))data[e]=[];});return data;}
  function write(data){db.save(data);}
  A.store={
    list:function(entity){return read()[entity]||[];},
    get:function(entity,id){var items=read()[entity]||[];for(var i=0;i<items.length;i++){if(items[i].id===id)return items[i];}return null;},
    create:function(entity,rec){var data=read();rec.id=Date.now()+'-'+Math.random().toString(36).slice(2,8);rec.created_at=new Date().toISOString();data[entity].push(rec);write(data);return rec;},
    update:function(entity,id,patch){var data=read();for(var i=0;i<data[entity].length;i++){if(data[entity][i].id===id){Object.assign(data[entity][i],patch);write(data);return data[entity][i];}}return null;},
    remove:function(entity,id){var data=read();data[entity]=data[entity].filter(function(r){return r.id!==id;});write(data);},
    byClient:function(entity,cid){return A.store.list(entity).filter(function(r){return r.client_id===cid;});},
    byProject:function(entity,pid){return A.store.list(entity).filter(function(r){return r.project_id===pid;});},
    count:function(entity){return A.store.list(entity).length;}
  };
})(window.App=window.App||{});
</script>
<script>
(function(A){
  A.router={
    routes:{},
    on:function(path,fn){A.router.routes[path]=fn;},
    go:function(path){window.location.hash='#'+path;},
    current:function(){return window.location.hash.replace(/^#/,'')||'/';},
    dispatch:function(){var path=A.router.current();var fn=A.router.routes[path]||A.router.routes['/']||function(){};fn(path);},
    init:function(){window.addEventListener('hashchange',A.router.dispatch);A.router.dispatch();}
  };
})(window.App=window.App||{});
</script>
<script>

})(window.App=window.App||{});
</script>

</script>

</script>
<script>
(function(A){
  var dom=A.utils.dom;
  A.views=A.views||{};
  A.views.layout={
    render:function(){
      var html='<nav class="nav" data-testid="nav">';
      html+='<a data-testid="nav-dashboard" href="#/">Dashboard</a>';
      html+='<a data-testid="nav-clients" href="#/clients">Clients</a>';
      html+='<a data-testid="nav-projects" href="#/projects">Projects</a>';
      html+='<a data-testid="nav-tasks" href="#/tasks">Tasks</a>';
      html+='<a data-testid="nav-notes" href="#/notes">Notes</a>';
      html+='<a data-testid="nav-expenses" href="#/expenses">Expenses</a>';
      html+='</nav><div id="content" data-testid="content"></div>';
      var app=document.getElementById('app');
      dom.clear(app);
      app.innerHTML=html;
    },
    setActive:function(path){
      var links=document.querySelectorAll('.nav a');
      for(var i=0;i<links.length;i++){links[i].className=(links[i].getAttribute('href')==='#'+path)?'active':'';}
    }
  };
})(window.App=window.App||{});
</script>
<script>
(function(A){
  var store=A.store;var dom=A.utils.dom;var fmt=A.utils.format;
  A.views=A.views||{};
  A.views.dashboard={
    render:function(){
      var c=document.getElementById('content');dom.clear(c);
      var html='<div class="view" data-testid="dashboard"><h2>Dashboard</h2><div class="stat-grid">';
      html+='<div class="stat-card"><h3>Clients</h3><div class="num">'+store.count('clients')+'</div></div>';
      html+='<div class="stat-card"><h3>Projects</h3><div class="num">'+store.count('projects')+'</div></div>';
      html+='<div class="stat-card"><h3>Tasks</h3><div class="num">'+store.count('tasks')+'</div></div>';
      html+='<div class="stat-card"><h3>Notes</h3><div class="num">'+store.count('notes')+'</div></div>';
      html+='<div class="stat-card"><h3>Expenses</h3><div class="num">'+store.count('expenses')+'</div></div>';
      var total=0;store.list('expenses').forEach(function(e){total+=Number(e.amount)||0;});
      html+='</div><div class="stat-card"><h3>Total Expenses</h3><div class="num">'+fmt.money(total)+'</div></div></div>';
      c.innerHTML=html;
    }
  };
})(window.App=window.App||{});
</script>
<script>
(function(A){
  var store=A.store;var dom=A.utils.dom;
  A.views=A.views||{};
  A.views.clients={
    render:function(){
      var c=document.getElementById('content');dom.clear(c);
      var html='<div class="view" data-testid="clients-view"><h2>Clients</h2>';
      html+='<form class="form" data-testid="client-form" id="client-form">';
      html+='<input data-testid="client-name" name="name" placeholder="Name" required>';
      html+='<input data-testid="client-email" name="email" placeholder="Email">';
      html+='<input data-testid="client-company" name="company" placeholder="Company">';
      html+='<input data-testid="client-phone" name="phone" placeholder="Phone">';
      html+='<button data-testid="client-submit" type="submit">Add Client</button></form>';
      var clients=store.list('clients');
      html+='<table data-testid="clients-table"><thead><tr><th>Name</th><th>Email</th><th>Company</th><th>Actions</th></tr></thead><tbody>';
      if(!clients.length)html+='<tr><td colspan="4" class="empty">No clients yet</td></tr>';
      clients.forEach(function(cl){
        html+='<tr data-testid="client-row" data-id="'+cl.id+'"><td>'+cl.name+'</td><td>'+(cl.email||'')+'</td><td>'+(cl.company||'')+'</td>';
        html+='<td><button data-testid="client-delete" data-id="'+cl.id+'">Delete</button></td></tr>';
      });
      html+='</tbody></table></div>';
      c.innerHTML=html;
      var form=document.getElementById('client-form');
      dom.on(form,'submit',function(e){
        e.preventDefault();
        var data={};A.models.client.fields.forEach(function(f){data[f]=form.querySelector('[name="'+f+'"]').value;});
        if(!A.utils.validate.required(data.name))return;
        store.create('clients',A.models.client.create(data));
        A.views.clients.render();
      });

      for(var i=0;i<dels.length;i++)dom.on(dels[i],'click',function(ev){store.remove('clients',ev.target.getAttribute('data-id'));A.views.clients.render();});
    }
  };
})(window.App=window.App||{});
</script>
