<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Age Calculator</title>
<link rel="manifest" href="manifest.json">
<style>
*{box-sizing:border-box}html,body{max-width:100%;overflow-x:hidden;margin:0;padding:0}img{max-width:100%;height:auto}
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;background:#fdf2f8;font-family:system-ui;color:#831843;padding:20px}
.card{background:#fff;border-radius:12px;padding:24px;width:100%;max-width:380px;margin:20px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
label{display:block;margin:10px 0 4px;font-size:14px;font-weight:600}
input{width:100%;height:44px;font-size:18px;padding:0 8px;border:1px solid #ccc;border-radius:8px}
button{width:100%;height:48px;font-size:18px;margin-top:16px;border:none;border-radius:8px;background:#db2777;color:#fff;cursor:pointer}
#age{font-size:48px;font-weight:700;color:#db2777;margin:12px 0;text-align:center}
#detail{font-size:14px;color:#6b7280;text-align:center}
</style>
</head><body>
<div class="card">
<h1 data-testid="title">Age Calculator</h1>
<label for="birthday">Birthday</label>
<input id="birthday" data-testid="birthday-input" type="date" value="1990-01-01">
<button id="calc-btn" data-testid="calc-btn">Calculate Age</button>
<div id="age" data-testid="age-display" data-record-id="">--</div>
<div id="detail" data-testid="detail-display"></div>
</div>
<script>
function calc(){var bd=document.getElementById('birthday').value;if(!bd)return;var d=new Date(bd);var now=new Date();var years=now.getFullYear()-d.getFullYear();var m=now.getMonth()-d.getMonth();if(m<0||(m===0&&now.getDate()<d.getDate()))years--;if(years<0)years=0;var days=Math.floor((now-d)/(1000*60*60*24));document.getElementById('age').textContent=years+' years';document.getElementById('detail').textContent=days.toLocaleString()+' days alive';window.appState={birthday:bd,years:years,days:days};localStorage.setItem('age-last',JSON.stringify(window.appState));var ageEl=document.getElementById('age');ageEl.dataset.recordId='age-'+years;}
document.getElementById('calc-btn').addEventListener('click',calc);
window.appState={birthday:'1990-01-01',years:0,days:0};
var last=localStorage.getItem('age-last');if(last){try{var p=JSON.parse(last);document.getElementById('birthday').value=p.birthday;}catch(e){}}
</script>
</body></html>
