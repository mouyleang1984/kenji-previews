<!DOCTYPE html><html><head><meta name='viewport' content='width=device-width, initial-scale=1'><title>Streak Board</title></head><body><h1>Streak Board</h1><input id='name' placeholder='Habit name'><button onclick='add()'>Add</button><ul id='list'></ul><script>async function add(){ const name = document.getElementById('name').value; await fetch('/api/habits', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({name})}); location.reload(); } async function mark(id){ await fetch(`/api/habits/${id}/mark`, {method:'POST'}); location.reload(); } fetch('/api/habits').then(r=>r.json()).then(d => { d.forEach(h => { document.getElementById('list').innerHTML += `<li>${h.name} - Streak: ${h.streak} <button onclick='mark("${h._id}")'>Done</button></li>`; }); });</script></body></html>
