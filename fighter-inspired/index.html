  <link rel="manifest" href="manifest.json"><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1,viewport-fit=cover'><title>Fighter Inspired</title></head><body><main id='app'></main><script>const state = { p1: { x: 50, hp: 100 }, p2: { x: 300, hp: 100 }, round: 1, gameOver: false }; const render = () => { document.querySelector('[data-testid=health-bar-player-1]').value = state.p1.hp; document.querySelector('[data-testid=health-bar-player-2]').value = state.p2.hp; document.querySelector('[data-testid=round-timer]').textContent = 'Round: ' + state.round; document.querySelector('[data-testid=player-character-sprite]').style.left = state.p1.x + 'px'; document.querySelector('[data-testid=opponent-character-sprite]').style.left = state.p2.x + 'px'; if (state.gameOver) { document.querySelector('[data-testid=round-announcer]').textContent = 'GAME OVER'; document.querySelector('[data-testid=match-results-modal]').style.display = 'block'; } requestAnimationFrame(render); }; const init = () => { document.getElementById('app').innerHTML = `<div data-testid='game-container' style='position:relative; height:200px; background:#0a0a0a; color:white; overflow:hidden'> <span data-testid='round-timer'>Round: 1</span> <progress data-testid='health-bar-player-1' value='100' max='100'></progress> <progress data-testid='health-bar-player-2' value='100' max='100'></progress> <div data-testid='player-character-sprite' style='position:absolute; bottom:0; width:40px; height:50px; background:blue'></div> <div data-testid='opponent-character-sprite' style='position:absolute; bottom:0; width:40px; height:50px; background:red'></div> <div data-testid='round-announcer'></div> <div data-testid='match-results-modal' style='display:none; position:absolute; inset:0; background:rgba(0,0,0,0.8); z-index:10'> <button data-testid='btn-restart-match' style='min-height:44px; min-width:44px'>Restart</button> </div> <div style='display:flex; flex-wrap:wrap; margin-top:20px'> <button data-testid='btn-attack-light' style='min-height:44px; min-width:44px'>Light</button> <button data-testid='btn-attack-heavy' style='min-height:44px; min-width:44px'>Heavy</button> <button data-testid='btn-move-left' style='min-height:44px; min-width:44px'>Left</button> <button data-testid='btn-move-right' style='min-height:44px; min-width:44px'>Right</button> <button data-testid='btn-jump' style='min-height:44px; min-width:44px'>Jump</button> </div> </div>`; document.querySelector('[data-testid=btn-attack-light]').onclick = () => { state.p2.hp = Math.max(0, state.p2.hp - 10); if(state.p2.hp <= 0) state.gameOver = true; }; document.querySelector('[data-testid=btn-restart-match]').onclick = () => { state.p1.hp = 100; state.p2.hp = 100; state.gameOver = false; document.querySelector('[data-testid=match-results-modal]').style.display = 'none'; }; render(); }; init();</script></body></html>
